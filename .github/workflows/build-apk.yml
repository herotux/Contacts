name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          cat > local.properties <<'EOF'
          sdk.dir=$ANDROID_HOME
          RIGHT_APP_KEY=
          PRODUCT_ID_X1=
          PRODUCT_ID_X2=
          PRODUCT_ID_X3=
          SUBSCRIPTION_ID_X1=
          SUBSCRIPTION_ID_X2=
          SUBSCRIPTION_ID_X3=
          SUBSCRIPTION_YEAR_ID_X1=
          SUBSCRIPTION_YEAR_ID_X2=
          SUBSCRIPTION_YEAR_ID_X3=
          EOF

      - name: Build FOSS debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Contacts-FOSS-debug
          path: app/build/outputs/apk/debug/*foss*debug*.apk
          if-no-files-found: error
